name: Zbuduj APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

# Domyślnie tylko odczyt. Zapis (Releases) ma wyłącznie job "release" poniżej.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Pobierz kod
        uses: actions/checkout@v4

      - name: Zainstaluj Javę 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Zainstaluj Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Zbuduj APK
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Przygotuj plik APK
        run: cp app/build/outputs/apk/release/app-release.apk LicznikKM.apk

      - name: Zapisz APK jako artefakt
        uses: actions/upload-artifact@v4
        with:
          name: LicznikKM-apk
          path: LicznikKM.apk

  # APK pojawia się w zakładce "Releases" – można go pobrać prosto na telefon.
  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Pobierz zbudowany APK
        uses: actions/download-artifact@v4
        with:
          name: LicznikKM-apk

      - name: Opublikuj w Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_number }}" LicznikKM.apk \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "Licznik K/M – wersja ${{ github.run_number }}" \
            --notes "Pobierz plik LicznikKM.apk na telefon i zainstaluj." \
            --latest
